    </style>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        .qr-matrix { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; background: white; padding: 12px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        .qr-matrix canvas { width: 100% !important; height: auto !important; border-radius: 8px; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen text-slate-900 pb-20">

<div class="max-w-xl mx-auto px-4 pt-8">
    <div class="mb-8">
        <h1 class="text-2xl font-black text-slate-800 tracking-tighter">AirScan <span class="text-blue-600">Fountain</span></h1>
    </div>

    <div id="panel-send" class="space-y-4">
        <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-gray-100">
            <textarea id="inputText" class="w-full p-5 bg-gray-50 border-2 border-dashed border-gray-200 rounded-2xl h-32 focus:border-blue-500 outline-none text-sm mb-4" placeholder="输入文字或选择文件..."></textarea>

            <div id="fileInfo" class="hidden mb-4 p-4 bg-blue-50 rounded-2xl flex justify-between items-center">
                <div class="truncate mr-4">
                    <p id="fileName" class="text-xs font-bold text-blue-700 truncate"></p>
                    <p id="fileMeta" class="text-[10px] font-bold text-slate-400"></p>
                </div>
                <button id="btnCancelFile" onclick="resetFile()" class="text-xs font-bold text-red-500">取消</button>
            </div>

            <div id="segmentPanel" class="hidden mb-4 space-y-4">
                <div id="segmentList" class="space-y-4"></div>
                <p class="text-[10px] font-bold text-slate-400">请按顺序逐段发送，每段完成后再发送下一段。</p>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <button id="btnChooseFile" onclick="document.getElementById('fileInput').click()" class="py-4 bg-gray-100 rounded-2xl font-bold text-sm">📎 选文件</button>
                <input type="file" id="fileInput" class="hidden">
                <button id="btnStart" onclick="startSending()" class="py-4 bg-blue-600 text-white rounded-2xl font-bold text-sm shadow-xl">🚀 开始喷泉发射</button>
            </div>
        </div>

        <div id="playerBox" class="hidden space-y-4">
            <div class="qr-matrix" id="qrContainer">
                <canvas id="qr0"></canvas>
                <canvas id="qr1"></canvas>
                <canvas id="qr2"></canvas>
                <canvas id="qr3"></canvas>
            </div>
            <div class="bg-white p-6 rounded-[2rem] text-center">
                <p class="text-xs font-black text-slate-400 uppercase tracking-widest mb-1">正在循环生成随机喷泉包</p>
                <div id="sendStats" class="text-2xl font-mono font-black text-blue-600">0 Chunks</div>
                <button id="btnFinishTransfer" onclick="finishCurrentTransfer()" class="mt-4 px-8 py-2 bg-slate-900 text-white rounded-xl text-xs font-bold">停止发送</button>
            </div>
        </div>
    </div>

</div>

<script>
const SEGMENT_SIZE = 256 * 1024;
const FOUNTAIN_CHUNK_SIZE = 220;
const PROTOCOL_VERSION = "ASQ3";

const Utils = {
    PRNG: (s) => () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; },
    xor: (a, b) => { for (let i = 0; i < a.length; i++) a[i] ^= b[i]; },
    u2b: (u8) => btoa(String.fromCharCode.apply(null, u8)),
    getDegree: (L, rng) => {
        const p = rng();
        if (p < 0.4) return 1;
        if (p < 0.7) return 2;
        if (p < 0.9) return Math.min(L, Math.floor(rng() * 10) + 3);
        return Math.min(L, Math.floor(rng() * L * 0.5) + 2);
    }
};

function formatSize(bytes) {
    if (bytes >= 1024 * 1024) return `${(bytes / 1024 / 1024).toFixed(bytes % (1024 * 1024) ? 1 : 0)} MiB`;
    if (bytes >= 1024) return `${(bytes / 1024).toFixed(bytes % 1024 ? 1 : 0)} KiB`;
    return `${bytes} B`;
}

function newTransferId() {
    if (crypto.randomUUID) return crypto.randomUUID().replace(/-/g, '').slice(0, 12).toUpperCase();
    return Math.random().toString(36).slice(2, 14).toUpperCase();
}

async function sha256Hex(data) {
    if (!crypto.subtle) throw new Error("当前浏览器不支持 SHA-256");
    const digest = new Uint8Array(await crypto.subtle.digest("SHA-256", data));
    return Array.from(digest, b => b.toString(16).padStart(2, '0')).join('');
}

let sender = {
    chunks: [], qrs: [], timer: null, fps: 15,
    file: null, fileName: "", fileSize: 0, transferId: "",
    segments: [], nextSegment: 0, activeSegment: -1,
    retransmitting: false, locked: false, mode: "", current: null
};

function initSender() {
    for(let i=0; i<4; i++) {
        sender.qrs[i] = new QRious({ element: document.getElementById(`qr${i}`), size: 300, level: 'L' });
    }
}

function setSenderLocked(locked) {
    sender.locked = locked;
    document.getElementById('btnChooseFile').disabled = locked;
    document.getElementById('fileInput').disabled = locked;
    document.getElementById('btnCancelFile').disabled = locked;
    document.getElementById('btnStart').disabled = locked;
    document.getElementById('inputText').disabled = locked || Boolean(sender.file);
}

function renderSenderSegments() {
    const list = document.getElementById('segmentList');
    list.innerHTML = sender.segments.map((segment, index) => {
        const active = sender.activeSegment === index;
        const completed = segment.status === 'completed';
        const enabled = !sender.locked && (index === sender.nextSegment || completed);
        const label = active ? '正在传输' : completed ? '重新传输' : index === sender.nextSegment ? '开始传输' : '等待前一段';
        const status = active ? '传输中' : completed ? '已完成' : index === sender.nextSegment ? '可传输' : '等待';
        return `<div class="p-4 bg-gray-100 rounded-2xl flex justify-between items-center">
            <div><p class="text-xs font-bold text-slate-800">第 ${index + 1}/${sender.segments.length} 段</p><p class="text-[10px] font-bold text-slate-400">${formatSize(segment.size)} · ${status}</p></div>
            <button onclick="startFileSegment(${index})" ${enabled ? '' : 'disabled'} class="px-8 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold" style="opacity:${enabled ? 1 : 0.45}">${label}</button>
        </div>`;
    }).join('');
}

async function startSending() {
    if (sender.file || sender.locked) return;
    const text = document.getElementById('inputText').value;
    if (!text) return alert("请先输入内容");
    const data = new TextEncoder().encode(text);
    setSenderLocked(true);
    sender.mode = 'text';
    try {
        const hash = await sha256Hex(data);
        beginPacketStream(data, {
            transferId: newTransferId(), kind: 'T', segmentIndex: 0, segmentCount: 1,
            fileName: `note_${Date.now().toString().slice(-4)}.txt`, fileSize: data.length,
            segmentSize: data.length, hash
        });
    } catch (e) {
        sender.mode = '';
        setSenderLocked(false);
        alert(e.message);
    }
}

async function startFileSegment(index) {
    if (!sender.file || sender.locked) return;
    const segment = sender.segments[index];
    if (!segment || (index !== sender.nextSegment && segment.status !== 'completed')) return;

    sender.activeSegment = index;
    sender.retransmitting = segment.status === 'completed';
    sender.mode = 'file';
    setSenderLocked(true);
    renderSenderSegments();
    try {
        const data = new Uint8Array(await new Response(sender.file.slice(segment.start, segment.end)).arrayBuffer());
        if (!segment.hash) segment.hash = await sha256Hex(data);
        beginPacketStream(data, {
            transferId: sender.transferId, kind: 'F', segmentIndex: index,
            segmentCount: sender.segments.length, fileName: sender.fileName,
            fileSize: sender.fileSize, segmentSize: segment.size, hash: segment.hash
        });
    } catch (e) {
        sender.activeSegment = -1;
        sender.mode = '';
        setSenderLocked(false);
        renderSenderSegments();
        alert(e.message);
    }
}

function beginPacketStream(data, meta) {
    sender.chunks = [];
    for (let i = 0; i < data.length; i += FOUNTAIN_CHUNK_SIZE) {
        let chunk = data.slice(i, i + FOUNTAIN_CHUNK_SIZE);
        if (chunk.length < FOUNTAIN_CHUNK_SIZE) {
            const padded = new Uint8Array(FOUNTAIN_CHUNK_SIZE);
            padded.set(chunk);
            chunk = padded;
        }
        sender.chunks.push(chunk);
    }
    sender.current = meta;
    document.getElementById('playerBox').classList.remove('hidden');
    document.getElementById('sendStats').innerText = meta.kind === 'F'
        ? `第 ${meta.segmentIndex + 1}/${meta.segmentCount} 段 · ${sender.chunks.length} Chunks`
        : `${sender.chunks.length} Chunks`;
    document.getElementById('btnFinishTransfer').innerText = meta.kind === 'F' ? '完成本段' : '停止发送';
    tick();
    sender.timer = setInterval(tick, 1000 / sender.fps);
}

function tick() {
    if (!sender.current || sender.chunks.length === 0) return;
    const L = sender.chunks.length;
    const meta = sender.current;
    for (let i = 0; i < 4; i++) {
        const seed = Math.floor(Math.random() * 999999) + 1;
        const rng = Utils.PRNG(seed);
        const d = Math.min(L, Utils.getDegree(L, rng));
        const idxs = [];
        while (idxs.length < d) {
            let x = Math.floor(rng() * L);
            if (!idxs.includes(x)) idxs.push(x);
        }
        const xorBuf = new Uint8Array(FOUNTAIN_CHUNK_SIZE);
        idxs.forEach(idx => Utils.xor(xorBuf, sender.chunks[idx]));
        sender.qrs[i].value = [
            PROTOCOL_VERSION, meta.transferId, meta.kind, meta.segmentIndex, meta.segmentCount,
            seed, L, Utils.u2b(xorBuf), encodeURIComponent(meta.fileName), meta.fileSize,
            meta.segmentSize, meta.hash
        ].join('|');
    }
}

function finishCurrentTransfer() {
    if (!sender.current) return;
    clearInterval(sender.timer);
    sender.timer = null;
    document.getElementById('playerBox').classList.add('hidden');
    if (sender.mode === 'file') {
        const index = sender.activeSegment;
        sender.segments[index].status = 'completed';
        if (!sender.retransmitting && index === sender.nextSegment) sender.nextSegment++;
        sender.activeSegment = -1;
        sender.retransmitting = false;
    }
    sender.mode = '';
    sender.current = null;
    setSenderLocked(false);
    if (sender.file) renderSenderSegments();
}


document.getElementById('fileInput').onchange = (e) => {
    const f = e.target.files[0]; if(!f) return;
    if (f.size === 0) {
        e.target.value = '';
        return alert('空文件无需传输');
    }
    sender.file = f;
    sender.fileName = f.name;
    sender.fileSize = f.size;
    sender.transferId = newTransferId();
    sender.nextSegment = 0;
    sender.activeSegment = -1;
    sender.segments = [];
    for (let start = 0; start < f.size; start += SEGMENT_SIZE) {
        const end = Math.min(start + SEGMENT_SIZE, f.size);
        sender.segments.push({start, end, size: end - start, status: 'waiting', hash: ''});
    }
    document.getElementById('fileInfo').classList.remove('hidden');
    document.getElementById('segmentPanel').classList.remove('hidden');
    document.getElementById('fileName').innerText = f.name;
    document.getElementById('fileMeta').innerText = `${formatSize(f.size)} · ${sender.segments.length} 段`;
    document.getElementById('btnStart').classList.add('hidden');
    document.getElementById('inputText').disabled = true;
    renderSenderSegments();
};

function resetFile() {
    if (sender.locked) return;
    sender.file = null;
    sender.fileName = '';
    sender.fileSize = 0;
    sender.transferId = '';
    sender.segments = [];
    sender.nextSegment = 0;
    sender.activeSegment = -1;
    document.getElementById('fileInfo').classList.add('hidden');
    document.getElementById('segmentPanel').classList.add('hidden');
    document.getElementById('segmentList').innerHTML = '';
    document.getElementById('fileInput').value = '';
    document.getElementById('btnStart').classList.remove('hidden');
    document.getElementById('inputText').disabled = false;
}

initSender();
</script>
</body>
</html>
